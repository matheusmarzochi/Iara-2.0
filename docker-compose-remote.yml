services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: iara-app
    image: iara-app
    networks:
      - iara
    env_file:
      - .env.remote
    volumes:
      - ./app:/code/app
      - ./shared:/code/shared
    ports:
      - 3001:3000
    expose:
      - 3000
    command: npm run dev
  drizzle-studio:
    build: ./app/.
    image: iara-app
    container_name: iara-drizzle-studio
    networks:
      - iara
    volumes:
      - ./shared/:/code/shared
    working_dir: /code/shared
    env_file:
      - ./.env.remote
    ports:
      - 4983:4983
    command: npm run db:studio
networks:
  iara:
    name: iara
