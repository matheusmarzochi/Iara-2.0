services:
  worker:
    build: ./worker/.
    container_name: iara-prd-worker
    image: iara-worker
    networks:
      - iara-prd
    env_file:
      - .env.production
    volumes:
      - ./worker:/code/worker
      - ./shared:/code/shared
    command: npm run dev
networks:
  iara-prd:
    name: iara-prd
