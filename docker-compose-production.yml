services:
  worker:
    build: ./worker/.
    container_name: iara-prd-worker
    image: iara-worker
    networks:
      - iara-prd
    env_file:
      - .env.production
    volumes:
      - ./worker:/code/worker
      - ./app/node_modules:/code/app/node_modules
      - ./app/src/database:/code/app/src/database
    command: npm run dev
networks:
  iara-prd:
    name: iara-prd
