services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: iara-stg-app
    image: iara-app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iara-stg
    env_file:
      - .env.staging
    volumes:
      - ./app:/code/app
      - ./shared:/code/shared
    expose:
      - 3000
    command: npm run dev
  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: iara-stg-worker
    image: iara-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iara-stg
      - ollama
    env_file:
      - .env.staging
    volumes:
      - ./worker:/code/worker
      - ./shared:/code/shared
    command: npm run dev
  rabbitmq:
    image: rabbitmq:3-management
    container_name: iara-stg-rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - iara-stg
    env_file:
      - .env.staging
    expose:
      - 5672
      - 15672
    ports:
      - 56720:5672
    volumes:
      - ./queue:/var/lib/rabbitmq
  postgres:
    container_name: iara-stg-postgres
    image: postgres
    restart: always
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iara-stg
    expose:
      - 5432
    ports:
      - 54320:5432
    env_file:
      - ./.env.staging
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres:/var/lib/postgresql/data
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: iara-stg-cloudflared-tunnel
    networks:
      - iara-stg
    env_file:
      - ./.env.staging
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
  drizzle-studio:
    build: ./app/.
    image: iara-app
    container_name: iara-stg-drizzle-studio
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iara-stg
    volumes:
      - ./shared/:/code/shared
    working_dir: /code/shared
    env_file:
      - ./.env.staging
    expose:
      - 4983
    command: npm run db:studio

networks:
  iara-stg:
    name: iara-stg
  ollama:
    name: ollama
