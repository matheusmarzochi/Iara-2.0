services:
  api:
    container_name: iara-app
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    volumes:
      - ./:/app
    env_file:
      - ./.env.local
    ports:
      - 3000:3000
    entrypoint: ["pnpm", "dev"]

  postgres:
    container_name: iara-postgres
    image: postgres
    restart: always
    shm_size: 128mb
    expose:
      - 5432
    env_file:
      - ./.env.local
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres:/var/lib/postgresql/data

  drizzle-studio:
    container_name: iara-drizzle-studio
    build:
      context: .
      dockerfile: Dockerfile
      target: studio
    restart: always
    volumes:
      - ./:/app
    env_file:
      - ./.env.local
    ports:
      - 4983:4983
