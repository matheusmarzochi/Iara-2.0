services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: iara-app
    image: iara-app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iara
    env_file:
      - .env.local
    volumes:
      - ./app:/code/app
      - ./shared:/code/shared
    ports:
      - 3001:3000
    expose:
      - 3000
    command: npm run dev
  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: iara-worker
    image: iara-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iara
    env_file:
      - .env.local
    volumes:
      - ./worker:/code/worker
      - ./shared:/code/shared
    command: npm run dev
  rabbitmq:
    image: rabbitmq:3-management
    container_name: iara-rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - iara
    env_file:
      - .env.local
    expose:
      - 5672
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./queue:/var/lib/rabbitmq
  postgres:
    container_name: iara-postgres
    image: postgres
    restart: always
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iara
    expose:
      - 5432
    env_file:
      - ./.env.local
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres:/var/lib/postgresql/data
  drizzle-studio:
    build: 
      context: .
      dockerfile: ./app/Dockerfile
    image: iara-app
    container_name: iara-drizzle-studio
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iara
    volumes:
      - ./shared/:/code/shared
    working_dir: /code/shared
    env_file:
      - ./.env.local
    ports:
      - 4983:4983
    command: npm run db:studio
  ngrok:
    image: ngrok/ngrok:latest
    container_name: iara-grok
    networks:
      - iara
    env_file:
      - ./.env.local
    ports:
      - 4040:4040
    command:
      - "http"
      - "http://iara-app:3000"
  ollama:
    image: ollama/ollama
    container_name: iara-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - iara
    volumes:
      - ./ollama:/root/.ollama
    expose:
      - 11434
  minio:
    image: quay.io/minio/minio
    container_name: iara-minio
    networks:
      - iara
    ports:
      - 9000:9000
      - 9001:9001
    env_file:
      - ./.env.local
    volumes:
      - ./minio:/data
    command: server /data --console-address ":9001"
networks:
  iara:
    name: iara
